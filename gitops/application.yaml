apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sre-copilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/keerthikondisetty/aws-ai-sre-copilot.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-sre-copilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
