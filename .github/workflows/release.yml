name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Show GitOps promotion command
        run: |
          echo "Promote after approval:"
          echo "cd deploy/overlays/dev && kustomize edit set image ai-sre-copilot=${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"

