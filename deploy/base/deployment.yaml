apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-copilot
  namespace: ai-sre-copilot
  labels:
    app.kubernetes.io/name: ai-sre-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sre-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sre-copilot
    spec:
      serviceAccountName: ai-sre-copilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copilot
          image: ai-sre-copilot:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-sre-copilot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http

